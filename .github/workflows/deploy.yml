name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

# One run per ref at a time, in push order: an older run must never deploy over a newer one, and two
# runs must never apply the same migration at once. Workflow-level, so the queue follows push order.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - name: Install tidy
        timeout-minutes: 5
        # apt-get update occasionally hangs on the hosted runners; the cached lists usually suffice.
        run: sudo apt-get install -y -q tidy || (sudo apt-get update -q && sudo apt-get install -y -q tidy)
      - run: scripts/verify.sh
        env:
          VERIFY_STRICT: "1"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx eslint .
      - run: npx vitest run

  deploy:
    needs: [verify, test]
    # A manual run deploys too: recovering this site must never require inventing a commit.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      # wrangler prints the database id, every variable and the zone, and GitHub masks a value only
      # where it equals a whole secret; these logs are public. Everything else, errors too, passes.
      REDACT: 's/[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}/<id>/g; /^env\./d; /\(zone name: /d'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          # The version stamp below is `git describe`, and a shallow clone carries no tags.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Write wrangler.toml
        # The real configuration names the domain, the database and the bucket, so it lives in a
        # secret rather than in the repository. Paste the whole file into WRANGLER_TOML.
        run: printf '%s' "$WRANGLER_TOML" > wrangler.toml
        env:
          WRANGLER_TOML: ${{ secrets.WRANGLER_TOML }}
      # The lockfile's wrangler, run directly: no third-party action ever holds the API token.
      - name: Apply D1 migrations
        run: |
          set -o pipefail
          npx wrangler d1 migrations apply DB --remote 2>&1 | sed -E "$REDACT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Stamp version
        # The tag `make release` pushed, plus how far past it this deploy is when it is not sitting
        # exactly on one. With no tags in the repository at all, `git describe` fails and the old
        # timestamp stands in, so this needs no flag day.
        run: |
          version="$(git describe --tags 2>/dev/null || date -u +%Y%m%d.%H%M)"
          printf '{"version":"%s","at":%s}\n' "$version" "$(date -u +%s)" > public/app/version.json
      - name: Deploy Worker
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | sed -E "$REDACT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
