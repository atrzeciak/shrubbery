name: Documentation
description: Something in the documentation is wrong, missing, or led you astray.
labels: ["documentation"]
body:
  - type: dropdown
    id: file
    attributes:
      label: Which document
      options:
        - README.md
        - ARCHITECTURE.md
        - DEVELOPER_GUIDE.md
        - CONTRIBUTING.md
        - SECURITY.md
        - CLAUDE.md
        - Somewhere else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What it says, and what is actually true
      description: >
        A step that does not work, a name that has changed, or something the setup needed that
        nothing told you about.
    validations:
      required: true
